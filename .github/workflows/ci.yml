# Checks SINGE on every pull request and every push to main: EduGame Kit's check, a build of every
# package, and the browser test (tests/e2e_browser.py), which plays each package in English and French.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  KIT_VERSION: main

jobs:
  test:
    name: Check, build and play
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "edugame-kit @ git+https://github.com/togetherings/edugame-kit@${KIT_VERSION}" playwright
      - run: python -m playwright install --with-deps chromium
      - name: Check the game (words, packages, maps)
        run: edugame check .
      - name: Build every package
        run: edugame build . -o dist && ls -l dist
      - name: Browser test
        run: python -m tests.e2e_browser --screenshots screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

  # The one check the "Protect main" ruleset requires in every togetherings repository: it passes only when
  # every job above passed, so tests can be added or renamed without changing the ruleset.
  checks-passed:
    name: Checks passed
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
