# Builds the Kolibri zips with EduGame Kit, one per package of maps in edugame.json (files at the ROOT of each zip)
# and attaches it to the release when a tag such as v0.2.1 is pushed, together with the
# unofficial Sierra Leone boundary data zip from data/sierra_leone/.
name: Release zip

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Name the release
        id: name
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME}"; else v="dev-${GITHUB_SHA::7}"; fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"

      - name: Install EduGame Kit
        run: pip install "git+https://github.com/togetherings/edugame-kit.git"

      - name: Build the packages (one zip per package in edugame.json)
        run: |
          edugame check .
          edugame build . -o dist
          for z in dist/*.zip; do
            echo "== $z"; unzip -l "$z" | tail -1
            # kolibri-game.json must sit at the root of each zip, not inside a folder
            unzip -Z1 "$z" | grep -qx 'kolibri-game.json'
          done

      - name: Name the Sierra Leone boundary data zip (unofficial GeoJSON package)
        id: data
        run: |
          src=data/sierra_leone/sle_admin_boundaries_unofficial.geojson.zip
          out="sle_admin_boundaries_unofficial_${{ steps.name.outputs.version }}.geojson.zip"
          cp "$src" "$out"
          unzip -l "$out" | tail -3
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: singe-release-files
          path: |
            dist/*.zip
            ${{ steps.data.outputs.file }}

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            ${{ steps.data.outputs.file }}
          generate_release_notes: true
