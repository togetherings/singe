<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SINGE: Studies In Geography</title>
<script src="config.js"></script>
<!-- Made by the EduGame Kit ("edugame preview" or "edugame build"; see docs/GUIDE.md): the game's words and settings,
     and the helper that saves, picks the language and theme, and adds the header with the Options button. -->
<script src="edugame-config.js"></script>
<script src="edugame.js"></script>
<style>
  /* ---------- Colours (change here to re-theme the whole game) ----------
     Light is the default. The dark theme (further down) overrides the same names. */
  /* Contrast where it matters (text 4.5:1 or more; borders, answers against unanswered land, the pointer outline 3:1
     or more), calm colours elsewhere (the page and sea, places not in the game). The answer colours come from the
     Okabe-Ito and Paul Tol colour-blind-safe palettes and differ in lightness too, so they stay apart with colour
     blindness. (The light theme's yellow is the one exception: a real yellow can't be dark enough for 3:1 on white.) */
  :root {
    --sea: #d6e9f5;      /* page background and sea */
    --land: #f5f3ec;     /* unanswered region: a warm off-white */
    --text: #000000;     /* text */
    --line: #000000;     /* borders and outlines */
    --good: #009E73;     /* answered on the first try (Okabe-Ito bluish green) */
    --retry: #F0E442;    /* answered on a later try (Okabe-Ito yellow) */
    --bad: #D55E00;      /* wrong-click flash, the hint, needed the hint (Okabe-Ito vermillion) */
    --done-line: var(--line);   /* borders of answered regions */
    --point: #ffffff;    /* the pointer outline (hover and keyboard): a band of this, edged with --line */
    --shade: 1.15;       /* hover and keyboard: an answered place gets this much lighter */
    --land-hover: #ffffff;   /* hover and keyboard: an unanswered place (and an unanswered circle) */
    --card: #ffffff;     /* menu cards, information panel, buttons */
    --accent: #1f6f8b;   /* button hover: teal */
    --accent-strong: #155266;   /* hover on a button that is already teal (Apply in Options) */
    --accent-tint: rgba(31,111,139,.15);   /* hover on a choice in Options */
    --met-bg: #d7f0e1; --met-line: #117733;   /* mode button once its accuracy goal is reached */
    --header-bg: #000000; --header-text: #ffffff;
    --frame-bg: rgba(255,255,255,.55);   /* the outlined page area */
    --box-bg: transparent;               /* boxes around moved regions (Alaska etc.): the sea shows, as on the main map */
    --map-sea: #edf5fb;                  /* the sea as it shows on the map: --sea under the frame's --frame-bg (keep the two in step) */
    --inbox-bg: var(--map-sea);          /* the boxes under a world map: the main map's sea (solid, so the map never shows through) */
    --hint-pulse: #ffd7c2;               /* the hinted region pulses between vermillion and this */
    --ring-fill: var(--land); --ring-line: var(--line); --dot: var(--line);   /* circles: small countries and capitals */
    --tip-bg: #000000; --tip-text: #ffffff;                                     /* name label */
    --backdrop: rgba(0,0,0,.55);                                                /* behind pop-ups */
    --bar-bg: rgba(214,233,245,.92);   /* world map: the see-through chips of the game bar laid over the map */
    --water: var(--map-sea);   /* lakes, and the back of the boxes round moved regions (Alaska): the map's sea */
    --off: #e4e4e4; --off-line: #a8a8a8;   /* regions that are not part of the game: pale, so they stay in the background */
    --pageW: 760px;      /* page width; wider for horizontal maps (body.wide) */
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --sea: #0b1d2e; --land: #2a2a2a; --text: #ffffff; --line: #ffffff; --done-line: #ffffff;
    --good: #009E73; --retry: #F0E442; --bad: #D55E00;   /* the same Okabe-Ito green, yellow and vermillion */
    --point: #000000; --land-hover: #3d3d3d;
    --card: #17314a; --accent: #2f7f9f; --accent-strong: #24657f; --accent-tint: rgba(47,127,159,.3); --met-bg: #00382a; --met-line: #2fd3a0;
    --header-bg: #000000; --header-text: #ffffff;
    --frame-bg: rgba(255,255,255,.04);
    --hint-pulse: #5a2a12; --bar-bg: rgba(11,29,46,.92); --map-sea: #152636;
    --off: #34404c; --off-line: #4b5a69;   /* blue-grey: clearly not the sea, but calm */
    --tip-bg: #ffffff; --tip-text: #000000; --backdrop: rgba(0,0,0,.65);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--sea); color: var(--text);
         font: 16px/1.5 Georgia, "Times New Roman", serif; }
  body.wide { --pageW: 1200px; }
  .hidden { display: none; }
  /* text is hidden for a moment while the language files load, so it never flashes in the wrong language */
  body.loading #frame, body.loading #siteHeader div { visibility: hidden; }
  h2 { font-size: 1.6rem; margin: .2em 0 .4em; }
  button { font: inherit; cursor: pointer; border: 2px solid var(--line);
           background: var(--card); color: var(--text); border-radius: 6px; padding: 6px 14px; }
  button:hover, button:focus-visible { background: var(--accent); color: #fff; outline: none; }

  /* ---------- The kit's header (Options; on the website, the link to the sets of maps) and Options panel ----------
     The same buttons as the rest of the game: an outline in the border colour, teal on hover. */
  .eg-header .eg-options-button, .eg-header .eg-keys-button, .eg-header .eg-menu-link, .eg-card .eg-actions button, .eg-keys .eg-keys-close {
    font: inherit; border: 2px solid var(--line); background: var(--card); color: var(--text); border-radius: 6px; }
  .eg-header .eg-options-button:hover, .eg-header .eg-options-button:focus-visible,
  .eg-header .eg-keys-button:hover, .eg-header .eg-keys-button:focus-visible, .eg-keys .eg-keys-close:hover, .eg-keys .eg-keys-close:focus-visible,
  .eg-header .eg-menu-link:hover, .eg-header .eg-menu-link:focus-visible,
  .eg-card .eg-actions button:hover, .eg-card .eg-actions button:focus-visible { background: var(--accent); color: #fff; outline: none; }
  .eg-card .eg-actions .eg-primary { background: var(--accent); color: #fff; }
  .eg-card .eg-actions .eg-primary:hover, .eg-card .eg-actions .eg-primary:focus-visible { background: var(--accent-strong); }
  html .eg-overlay .eg-card, html[data-theme=dark] .eg-overlay .eg-card { background: var(--card); color: var(--text); border: 2px solid var(--line); border-radius: 8px;
           font: 16px/1.45 Georgia, "Times New Roman", serif; }
  .eg-overlay .eg-card fieldset { border-color: var(--line); }
  .eg-overlay .eg-card label { border-radius: 6px; padding-left: 6px; padding-right: 6px; }
  .eg-card label:hover, .eg-card label:focus-within { background: var(--accent-tint); }

  /* ---------- Header (shown on every page) and outlined frame ---------- */
  #siteHeader { background: var(--header-bg); color: var(--header-text); }
  #siteHeader.hidden { display: none; }
  #siteHeader div { max-width: var(--pageW); margin: 0 auto; padding: 8px 16px;
                    display: flex; justify-content: flex-end; align-items: center; gap: 12px; }
  /* Full Screen button at the end of the header */
  #fsBtn { font-size: .85rem; font-weight: normal; padding: 2px 10px; background: transparent;
           color: var(--header-text); border-color: var(--header-text); white-space: nowrap; }
  #fsBtn:hover, #fsBtn:focus-visible { background: var(--accent); }
  #fsBtn.hidden { display: none; }
  #frame { max-width: var(--pageW); margin: 16px auto; padding: 16px; border: 2px solid var(--line);
           border-radius: 8px; background: var(--frame-bg); }

  /* ---------- Menu: one card per map, one button per game mode ---------- */
  /* The menu's top line: the heading, then how many are done and the Keyboard button at the end (as on the website's menu) */
  #menuTop { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
  #menuTop h2 { flex: 1; margin: 0; }
  #menuDone { font-weight: bold; opacity: .8; }
  #menuList { display: grid; gap: 14px; margin-top: 14px; }
  .mapCard { background: var(--card); border: 2px solid var(--line); border-radius: 8px; padding: 12px 16px 16px; }
  /* optional picture on a map's card (set as "image" in the map's settings): floats to the right of the
     name and description and is scaled down so it can never push the mode buttons around */
  html[dir="rtl"] .mapCard .mapImg { float: left; margin: 0 12px 8px 0; }
  .mapCard .mapImg { float: right; max-width: 110px; max-height: 70px; width: auto; height: auto;
                     object-fit: contain; margin: 0 0 8px 12px; border: 1px solid var(--line); }
  .mapCard h3 { margin: 0; font-size: 1.3rem; }
  .mapCard .blurb { opacity: .75; margin-bottom: 10px; }
  .modes { clear: both; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .modeBtn { text-align: start; padding: 10px 12px; }
  .modeBtn b { display: block; }
  .modeBtn small { display: block; opacity: .8; }
  .modeBtn.goal { font-weight: bold; opacity: 1; }
  /* a mode whose accuracy goal has been reached */
  .modeBtn.met { background: var(--met-bg); border-color: var(--met-line); }
  .modeBtn.met:hover, .modeBtn.met:focus-visible { background: var(--accent); border-color: var(--line); }
  .credit { font-size: .8rem; opacity: .75; margin-top: 12px; }
  /* shown on a map with no translation into the chosen language */
  .langNote { display: inline-block; font-size: .8rem; opacity: .85; margin: 0 0 8px; padding: 0 8px;
              border: 1px solid var(--line); border-radius: 10px; }

  /* ---------- Game bar ----------
     A grid of three columns; everything is aligned to the TOP of its row. The outer columns are
     equal, so anything in the middle column stays centred. Normal layout:
        row 1   the prompt (left, two columns wide)                       Back to menu (right)
        row 2   zoom buttons (left)       skip + back arrows (centre)     Time / Found (right)
        row 3   feedback message (full width)
     Practice has no skip arrows, so the box with the number of regions and capitals takes their
     place in the centre of row 2, and Back to menu moves down to the right of that row.
     Flags mode: the flag sits in the middle and spans rows 1 and 2, and the skip arrows sit under it:
        row 1   prompt                    flag (rows 1-2)                 Back to menu
        row 2   zoom buttons                 "                            Time / Found
        row 3                             skip + back arrows (centre)
        row 4   feedback message
     The changing timer digits can never push anything around (fixed-width columns). */
  /* World map: the bar is laid over the top of the map. Only the buttons and text themselves take clicks
     (on a see-through chip); everywhere else the map underneath does. The frame and credit are made tighter too. */
  body.overlay #frame { margin: 6px auto; padding: 6px; }
  body.overlay #game { position: relative; }
  body.overlay .credit { margin-top: 3px; font-size: .75rem; line-height: 1.25; }
  /* The bar: line 1 = Back and the keys button (left), Skip back / Skip (middle), Time and Found or Practice's totals
     (right); line 2 = what to find, alone in the middle (the flag in Flags mode); line 3 = the feedback.
     Each line is either above the map (#bar) or laid over its top (#mapTop), as the map's "overlay" setting says. */
  #bar { display: flex; flex-direction: column; gap: 6px; }
  #bar:empty { display: none; }
  #row1 { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); column-gap: 8px; align-items: start; }
  #topBtns { grid-column: 1; justify-self: start; display: flex; gap: 6px; }
  #skipBtns { grid-column: 2; justify-self: center; display: flex; gap: 6px; }
  #skipBtns.hidden { display: none; }
  #skipBtns button { min-width: 2.4em; padding: 6px 10px; font-weight: bold; }
  #skipBtns button:disabled { opacity: .35; cursor: default; background: var(--card); color: var(--text); }
  /* Time and Found: the labels line up on the left, the numbers line up on the right */
  #stats { grid-column: 3; justify-self: end; display: grid; grid-template-columns: auto auto;
           column-gap: 14px; line-height: 1.3; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #stats .num { min-width: 3.2em; text-align: end; }
  #game.practice #stats { display: none; }             /* Practice has no timer or score... */
  #totals { grid-column: 3; justify-self: end; display: none; grid-template-columns: auto auto;   /* ...but totals */
            column-gap: 14px; line-height: 1.3; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #totals .num { min-width: 3.2em; text-align: end; }
  #game.practice #totals { display: grid; }
  #totals.noCaps .capRow { display: none; }
  #row2 { display: flex; justify-content: center; }
  #prompt { text-align: center; min-width: 0; font-size: 1.5rem; font-weight: bold; }
  #game.flagMode #prompt { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }   /* (for screen readers: the flag says it) */
  #promptFlag { display: block; max-height: 110px; max-width: 220px; cursor: zoom-in; }   /* (no border: flags that are not rectangles, like Nepal's, would look odd) */
  #promptFlag.hidden { display: none; }
  #feedback { text-align: center; min-height: 1.5em; }
  @media (max-width: 600px) { #promptFlag { max-height: 70px; max-width: 34vw; } #prompt { font-size: 1.25rem; } }
  @media (max-width: 480px) { #row1 button { padding: 6px 8px; font-size: .85rem; min-width: 0; } #stats .num { min-width: 2.2em; } #stats { column-gap: 8px; } }

  /* Lines laid over the map: only the buttons and text take clicks (on a see-through chip); the map underneath
     takes the rest */
  #mapWrap { position: relative; }
  #mapTop { position: absolute; top: 4px; left: 4px; right: 4px; z-index: 4; display: flex; flex-direction: column;
            align-items: stretch; gap: 4px; pointer-events: none; }
  #mapTop #row1 > *, #mapTop #prompt, #mapTop #feedback { pointer-events: auto; background: var(--bar-bg); border-radius: 6px; padding: 1px 8px; }
  #mapTop #topBtns, #mapTop #skipBtns { padding: 2px 6px; }
  #mapTop #promptFlag { pointer-events: auto; }
  #mapTop #feedback { align-self: center; min-height: 0; }
  #mapTop #feedback:empty { display: none; }

  /* Zoom: the whole map (⌂) over + over -, at the top right of the map (under any lines laid over it), or beside
     the map (the "overlay" setting's zoom: false) */
  #zoomBtns { display: flex; flex-direction: column; gap: 4px; }
  #mapWrap.zoomOver #zoomBtns { position: absolute; z-index: 3; top: calc(var(--topH, 0px) + 8px); right: 8px; }
  #mapWrap:not(.zoomOver) { display: flex; align-items: flex-start; gap: 6px; }
  #mapWrap:not(.zoomOver) #mapBox { flex: 1; min-width: 0; }
  #mapWrap:not(.zoomOver) #zoomBtns { order: 2; }
  #zoomBtns button { width: 2.2em; height: 2.2em; padding: 0; font-weight: bold; font-size: 1.1rem; line-height: 1;
                     box-shadow: 0 1px 3px rgba(0,0,0,.25); }

  /* ---------- Map ---------- */
  #mapBox { position: relative; }
  #mapBox svg { width: 100%; max-height: 72vh; display: block;
                touch-action: none; }   /* lets us handle pinch and drag ourselves */
  .region { fill-rule: evenodd; fill: var(--land); stroke: var(--line); stroke-width: 1.2;
            stroke-linejoin: round; cursor: pointer;
            vector-effect: non-scaling-stroke; }   /* borders stay thin when zoomed */
  /* regions that are drawn but not part of the game (e.g. D.C. when territories are off) */
  .region.inactive { pointer-events: none; cursor: default; }
  /* boxes drawn around regions that were moved to a new place (e.g. Alaska, Hawaii) */
  .frame-back { fill: var(--water); stroke: none; pointer-events: none; }
  .frame { fill: var(--box-bg); stroke: var(--line); stroke-width: 1.5; pointer-events: none;
           vector-effect: non-scaling-stroke; }
  /* invisible wide outline that makes small regions easier to tap */
  .halo { fill: none; stroke: rgba(0,0,0,0); stroke-width: 28px; pointer-events: stroke;
          vector-effect: non-scaling-stroke; cursor: pointer; }
  .region.done { fill: var(--good); stroke: var(--done-line); cursor: default; }
  .region.off, .region.off:hover, .capitals .region.off, .capitals .region.off:hover { fill: var(--off); stroke: var(--off-line); cursor: default; }
  .region.done.retry { fill: var(--retry); }
  .region.notmain, .mk.notmain { fill: var(--retry); }   /* a part of the country was clicked, not its main area: flashes yellow */
  /* The hint and the wrong-part flash also get a thick dashed outline, so they never look like an answered place
     (even when the pulse is off for people who ask for less motion) */
  /* (they also get the pointer outline, see "Pointer": the hint's flashes with it) */
  .region.done.hinted { fill: var(--bad); }
  .region.wrong { fill: var(--bad); }
  .region.hint { fill: var(--bad); animation: pulse .8s ease-in-out infinite alternate; }   /* hint flashes red */
  @keyframes pulse { to { fill: var(--hint-pulse); } }
  @media (prefers-reduced-motion: reduce) { .region.hint { animation: none; } }

  /* Capitals mode: regions stay plain green; capitals are circles on top */
  .capitals .region, .capitals .region:hover { fill: var(--land); cursor: default; }
  .cap .ring { fill: var(--ring-fill); stroke: var(--ring-line); stroke-width: 2; cursor: pointer;
               vector-effect: non-scaling-stroke; }
  .cap .hit { fill: transparent; cursor: pointer; pointer-events: all; }   /* big invisible tap area */
  .cap.found .hit { cursor: default; }
  .cap .dot { fill: var(--dot); display: none; pointer-events: none; }
  .cap.wrong .ring { fill: var(--bad) !important; }   /* wrong guess: flashes red (beats hover colour) */
  .cap.hint .ring { animation: pulseRed .8s ease-in-out infinite alternate; }
  @keyframes pulseRed { to { fill: var(--bad); } }
  .cap.found .ring { cursor: default; }
  .cap.found .dot { display: block; }              /* black dot once correctly picked */
  .cap.first .ring { fill: var(--good); }
  .cap.retry .ring { fill: var(--retry); }
  .cap.hinted .ring { fill: var(--bad); }
  @media (prefers-reduced-motion: reduce) { .cap.hint .ring { animation: none; fill: var(--bad); } }

  /* World map: markers of tiny countries and island chains (circles shown while the region is too small to click),
     and the fixed boxes under the map */
  .mk { fill: var(--ring-fill); stroke: var(--ring-line); stroke-width: 2; cursor: pointer; vector-effect: non-scaling-stroke; }
  .mk.done { fill: var(--good); cursor: default; }
  .mk.done.retry { fill: var(--retry); }
  .mk.done.hinted, .mk.wrong { fill: var(--bad); }
  .mk.hint { animation: pulse .8s ease-in-out infinite alternate; }
  @media (prefers-reduced-motion: reduce) { .mk.hint { animation: none; fill: var(--bad); } }
  /* The boxes overlap the bottom of the map: the strip itself takes no clicks, only the shapes in it do */
  #stripBox { position: relative; z-index: 2; pointer-events: none; }
  #stripBox svg { width: 100%; display: block; pointer-events: none; }
  #stripBox .region:not(.inactive), #stripBox .mk, #stripBox .cap { pointer-events: auto; }
  #stripBox .inbox { pointer-events: all; }          /* inside a box nothing of the map underneath can be hovered or clicked; around the boxes it can */
  /* straight-sided boxes around the island groups of the Pacific box, and big lakes drawn as water */
  .chain { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 5 3; opacity: .7; stroke-linejoin: round;
           vector-effect: non-scaling-stroke; pointer-events: none; }
  .lake { fill: var(--water); stroke: var(--line); stroke-width: 1; stroke-linejoin: round; pointer-events: none;
          fill-rule: evenodd; vector-effect: non-scaling-stroke; }
  .inbox { fill: var(--inbox-bg); stroke: var(--line); stroke-width: 1.5; pointer-events: none; vector-effect: non-scaling-stroke; }
  .intitle { fill: var(--text); font-size: 64px; font-weight: bold; pointer-events: none; }
  /* phones held upright while a wide map is on screen: ask for the device to be turned (the game still works) */
  #rotateHint { display: none; position: fixed; inset: 0; z-index: 60; background: var(--backdrop); color: #fff;
                align-items: center; justify-content: center; flex-direction: column; gap: 14px; text-align: center; padding: 24px; font-size: 1.2rem; }
  #rotateHint .turn { font-size: 3rem; line-height: 1; }
  body.needRotate #rotateHint { display: flex; }
  /* a region whose outline is a separate path (see addRegion in js/game.js) */
  .region.nostroke { stroke: none; }
  .rstroke.off, .lake.off { stroke: var(--off-line); }   /* a grey region's outline; a lake's shore, where grey (greyLakes) */
  .lakeline { fill: none; stroke: var(--line); stroke-width: 1; stroke-linejoin: round; pointer-events: none; vector-effect: non-scaling-stroke; }
  .rstroke { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-linejoin: round; pointer-events: none;
             vector-effect: non-scaling-stroke; }

  /* Name label shown when hovering a region that is already found */
  #tip { position: fixed; z-index: 5; pointer-events: none; background: var(--tip-bg); color: var(--tip-text);
         padding: 2px 8px; border-radius: 4px; font-size: .9rem; white-space: nowrap; }

  /* ---------- Information panel ---------- */
  #infoBack { position: fixed; inset: 0; z-index: 10; background: var(--backdrop);
              display: flex; align-items: center; justify-content: center; padding: 16px; }
  #infoBack.hidden { display: none; }
  #infoCard { position: relative; background: var(--card); border: 2px solid var(--line); border-radius: 8px;
              padding: 16px 20px; max-width: 440px; width: 100%; max-height: 85vh; overflow-y: auto; }
  #infoCard h3 { margin: 0 32px 0 0; font-size: 1.4rem; }
  #infoSub { opacity: .75; }
  #infoFlag.hidden { display: none; }
  #infoFlag { display: block; max-width: 220px; max-height: 150px; margin: 10px 0; }
  #infoText { white-space: pre-line; margin: 10px 0 0; }
  html[dir="rtl"] #infoClose { right: auto; left: 8px; }
  html[dir="rtl"] #flagClose { right: auto; left: -14px; }
  html[dir="rtl"] #infoCard h3 { margin: 0 0 0 32px; }
  #infoClose { position: absolute; top: 8px; right: 8px; width: 2em; padding: 2px 0; font-size: 1.1rem; line-height: 1; }

  /* ---------- Flag pop-up (click the flag in Flags mode to see it full size) ---------- */
  #flagBack { position: fixed; inset: 0; z-index: 10; background: var(--backdrop); cursor: zoom-out;
              display: flex; align-items: center; justify-content: center; padding: 16px; }
  #flagBack.hidden { display: none; }
  #flagCard { position: relative; background: var(--card); border: 2px solid var(--line); border-radius: 8px; padding: 12px; }
  #flagBig { display: block; max-width: 88vw; max-height: 80vh; min-width: min(70vw, 420px); object-fit: contain; }
  #flagClose { position: absolute; top: -14px; right: -14px; width: 2em; padding: 2px 0; font-size: 1.1rem; line-height: 1; }

  /* ---------- Pointer (hover and keyboard) ---------- */
  /* What the mouse or the keyboard points at changes colour (unanswered: --land-hover; answered: --shade lighter), and an outline drawn on top of
     everything: a band of --point edged with --line (on a circle, a ring round it, so its colour still shows).
     game.js draws the outline (drawPointers). */
  .region.hover:not(.inactive):not(.done):not(.hint):not(.wrong):not(.notmain), .region.kbd:not(.done):not(.hint):not(.wrong):not(.notmain),
  .mk.hover:not(.done):not(.hint):not(.wrong):not(.notmain), .mk.kbd:not(.done):not(.hint):not(.wrong):not(.notmain),
  .cap.hover:not(.found):not(.hint) .ring, .cap.kbd:not(.found):not(.hint) .ring { fill: var(--land-hover); }
  .region.done.hover, .region.done.kbd, .mk.done.hover, .mk.done.kbd, .cap.found.hover .ring, .cap.found.kbd .ring { filter: brightness(var(--shade)); }
  .capitals .region.hover:not(.off), .capitals .region.kbd { fill: var(--land) !important; filter: none; }
  .ptr { fill: none; pointer-events: none; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .ptr-edge { stroke: var(--line); stroke-width: 6px; }
  .ptr-band { stroke: var(--point); stroke-width: 3px; }
  /* The hint's outline flashes with its colour: light band while the place is orange, orange while it's pale */
  .ptr-band.ptr-flash { animation: ptrFlash .8s ease-in-out infinite alternate; }
  @keyframes ptrFlash { to { stroke: var(--bad); } }
  @media (prefers-reduced-motion: reduce) { .ptr-band.ptr-flash { animation: none; } }
  #mapBox:focus { outline: none; }
  #kbdRing { position: fixed; z-index: 3; pointer-events: none; border-radius: 50%; border: 4px solid var(--point);
             box-shadow: 0 0 0 2px var(--line), inset 0 0 0 2px var(--line); }
  #kbdRing.hidden { display: none; }                 /* the highlight shows where the keyboard is */
  /* The kit's list of keys (EduGame.addKeys, js/game.js) is a card like the Options panel (below); its first-key hint
     at the bottom of the screen is the name label's colours */
  body .eg-key-hint { background: var(--tip-bg); color: var(--tip-text); font: .95rem/1.4 Georgia, "Times New Roman", serif; border-radius: 4px; }
  .eg-overlay.eg-keys .eg-card { max-width: 520px; max-height: 85vh; overflow-y: auto; }

  /* ---------- Options page ---------- */

  /* ---------- Results page ---------- */
  #results p { margin: .4em 0; font-size: 1.15rem; }
  #results button { margin: 12px 8px 0 0; }
</style>
</head>
<body class="loading">

<!-- The kit adds its own header above everything: the title and the Options button. This one only holds the
     Full Screen button, and is hidden unless config.js says fullscreen_button: true. -->
<header id="siteHeader" class="hidden"><div><button id="fsBtn" type="button"></button></div></header>

<main id="frame">

  <!-- ======================= MENU PAGE ======================= -->
  <div id="menu">
    <div id="menuTop">
      <h2 data-t="menu.title"></h2>
      <span id="menuDone"></span>
    </div>
    <div id="menuList"></div>
  </div>

  <!-- ======================= GAME PAGE ======================= -->
  <div id="game" class="hidden">
    <!-- The bar: three lines, each above the map or laid over its top (a map's "overlay" setting; game.js applyLayout) -->
    <div id="bar">
      <div id="row1">
        <span id="topBtns">
          <button id="backBtn" data-t="game.back" data-t-attr="title:game.back_hint,aria-label:game.back_hint"></button>
        </span>
        <span id="skipBtns" class="hidden">
          <button id="skipPrev" data-t="skip.prev_icon" data-t-attr="title:skip.prev,aria-label:skip.prev"></button>
          <button id="skipNext" data-t="skip.next_icon" data-t-attr="title:skip.next,aria-label:skip.next"></button>
        </span>
        <div id="stats">
          <span data-t="game.time"></span><span id="time" class="num">0:00</span>
          <span data-t="game.found"></span><span class="num"><span id="found">0</span>/<span id="total">0</span></span>
        </div>
        <div id="totals">
          <span id="totRegLabel"></span><span id="totReg" class="num"></span>
          <span id="totCapLabel" class="capRow"></span><span id="totCap" class="num capRow"></span>
        </div>
      </div>
      <div id="row2">
        <div id="prompt"></div>
        <img id="promptFlag" class="hidden" tabindex="0" role="button" data-t-attr="alt:flag.alt,title:flag.hint">
      </div>
      <div id="feedback"></div>
    </div>
    <div id="mapWrap">
      <div id="mapTop"></div>   <!-- the bar's lines that lie over the map -->
      <span id="zoomBtns">
        <button id="zoomFull" data-t-attr="title:zoom.full_hint,aria-label:zoom.full_hint">&#x2302;&#xFE0E;</button>
        <button id="zoomIn" data-t-attr="title:zoom.in,aria-label:zoom.in">+</button>
        <button id="zoomOut" data-t-attr="title:zoom.out,aria-label:zoom.out">&minus;</button>
      </span>
      <div id="mapBox" tabindex="-1" role="application" data-t-attr="aria-label:keys.map"></div>
    </div>
    <div id="stripBox"></div>   <!-- world map: the fixed boxes under the map (Caribbean, Pacific) -->
    <div id="gameCredit" class="credit"></div>
  </div>

  <div id="rotateHint" role="alertdialog">
    <div class="turn" aria-hidden="true">&#x21BB;</div>
    <div data-t="rotate.hint"></div>
    <button id="rotateOk" data-t="rotate.continue"></button>
  </div>

  <!-- ======================= RESULTS PAGE ======================= -->
  <div id="results" class="hidden">
    <h2 data-t="results.title"></h2>
    <p id="resMap"></p>
    <p><span data-t="results.accuracy"></span> <b id="resAcc"></b></p>
    <p><span data-t="results.time"></span> <b id="resTime"></b></p>
    <p id="resBest"></p>
    <button id="againBtn" data-t="results.again"></button>
    <button id="menuBtn" data-t="results.menu"></button>
  </div>

</main>
<div id="tip" class="hidden"></div>
<div id="kbdRing" class="hidden" aria-hidden="true"></div>

<!-- Information panel (Practice mode): shown when a region or capital that has information is clicked -->
<!-- Full-size flag (Flags mode): shown when the flag is clicked -->
<div id="flagBack" class="hidden">
  <div id="flagCard" role="dialog" aria-modal="true" data-t-attr="aria-label:flag.full_alt">
    <button id="flagClose" data-t-attr="aria-label:common.close">&times;</button>
    <img id="flagBig" data-t-attr="alt:flag.full_alt">
  </div>
</div>

<div id="infoBack" class="hidden">
  <div id="infoCard" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
    <button id="infoClose" data-t-attr="aria-label:common.close">&times;</button>
    <h3 id="infoTitle"></h3>
    <div id="infoSub"></div>
    <img id="infoFlag" class="hidden" alt="">
    <p id="infoText"></p>
  </div>
</div>

<!-- Maps are NOT listed here: the maps of the package (edugame.json) are loaded automatically
     (maps/<name>/shapes.js and maps/<name>/settings.js). -->

<!-- ======================= GAME CODE ======================= -->
<script src="js/game.js"></script>
</body>
</html>
